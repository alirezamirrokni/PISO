    radius: 0.4
    radius_decay: 0.96
    step_size: 0.005
    step_decay: 0.98
    gamma: 2.0
    rho: 0.92
    known_fraction: 0.5
    batch_initial: 30
    batch_increment: 2
  GuidedPISO:
    radius: 0.4
    radius_decay: 0.96
    step_size: 0.005
    step_decay: 0.98
    gamma: 2.0
    rho: 0.92
    known_fraction: 0.5
    batch_initial: 30
    batch_increment: 2
    alpha: 0.98
  CyclePISO:
    radius: 0.4
    radius_decay: 0.96
    step_size: 0.005
