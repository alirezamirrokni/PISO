experiment:
  seed: 2024
  simulations: 100
  max_samples: 5000
  metric_samples: 1000
  figure_run: 0
  weeks:
  - 08
  - '12'
  - '21'
  - '25'
  - '29'
  - '32'
problem:
  products: 10
  buyers: 40
  initial_price: 0.5
  outside_weight_per_product: 0.1
  lower_inventory_factor: 0.5
  upper_inventory_factor: 1.5
  cost_ratio_low: 2.0
  cost_ratio_middle: 1.0
  cost_ratio_high: 3.0
  rho_low: 0.25
  rho_high: 0.5
methods:
  GZO_NS:
    mu0: 0.19
    mu_min: 0.0001
    beta0: 0.01
    beta_decay: 0.95
    mu_decay: 0.95
    alpha0: 0.0
    alpha_damping: 0.98
    batch_initial: 30
    batch_increment: 2
  GZO_HS:
    mu0: 0.19
    mu_min: 0.0001
    beta0: 0.01
    beta_decay: 0.95
    mu_decay: 0.95
    alpha0: 0.0
    alpha_damping: 0.98
    batch_initial: 30
    batch_increment: 2
    window: 1
  ZO_TG:
    mu0: 0.19
    mu_min: 0.0001
    beta0: 0.0031622776601683794
    beta_decay: 0.95
    mu_decay: 0.95
