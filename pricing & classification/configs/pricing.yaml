  methods:
  - GZO_NS
  - GZO_HS
  - ZO_TG
  - ZO_OGVR
  - GaussianPISO
  - GuidedPISO
  - CyclePISO
  - GaussianPISO2
  - GuidedPISO2
  - CyclePISO2
  y_limit_mode: final_window
