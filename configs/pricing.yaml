experiment:
  seed: 2024
  simulations: 100
  max_samples: 5000
  metric_samples: 1000
  weeks: ['08', '12', '21', '25', '29', '32']
problem:
  products: 10
  buyers: 40
  initial_price: 0.5
  outside_weight_per_product: 0.1
  lower_inventory_factor: 0.5
  upper_inventory_factor: 1.5
  cost_ratio_low: 2.0
  cost_ratio_middle: 1.0
  cost_ratio_high: 3.0
  rho_low: 0.25
  rho_high: 0.5
methods:
  GZO_NS: {mu0: 0.19, mu_min: 0.0001, mu_decay: 0.95, beta0: 0.01, beta_decay: 0.95, alpha0: 0.0, alpha_damping: 0.98, batch_initial: 30, batch_increment: 2}
  GZO_HS: {mu0: 0.19, mu_min: 0.0001, mu_decay: 0.95, beta0: 0.01, beta_decay: 0.95, alpha0: 0.0, alpha_damping: 0.98, window: 1, batch_initial: 30, batch_increment: 2}
  ZO_TG: {mu0: 0.19, mu_min: 0.0001, mu_decay: 0.95, beta0: 0.0031622776601683794, beta_decay: 0.95, batch_initial: 30, batch_increment: 2}
  ZO_OGVR: {mu0: 0.19, mu_min: 0.0001, mu_decay: 0.95, beta0: 0.001, beta_decay: 0.95, initial_samples: 20, s_max: 10, M: 0.1, batch_initial: 30, batch_increment: 2}
  GaussianPISO: {radius: 0.4, radius_decay: 0.96, step_size: 0.005, step_decay: 0.98, gamma: 2.0, rho: 0.92, rho_k: 0.0, known_fraction: 0.5, batch_initial: 30, batch_increment: 2}
  CyclePISO: {radius: 0.4, radius_decay: 0.96, step_size: 0.005, step_decay: 0.98, gamma: 2.0, rho: 0.92, rho_k: 0.0, known_fraction: 0.5, cycle_length: 10, batch_initial: 30, batch_increment: 2}
  GaussianPISO2: {radius: 0.4, radius_decay: 0.96, step_size: 0.005, step_decay: 1.0, gamma: 2.0, rho: 0.92, rho_k: 0.0, lambda: 0.25, known_fraction: 0.5, batch_initial: 30, batch_increment: 2}
  CyclePISO2: {radius: 0.4, radius_decay: 0.96, step_size: 0.005, step_decay: 1.0, gamma: 2.0, rho: 0.92, rho_k: 0.0, lambda: 0.25, known_fraction: 0.5, cycle_length: 10, batch_initial: 30, batch_increment: 2}
plotting:
  methods: [GZO_NS, GZO_HS, ZO_TG, ZO_OGVR, GaussianPISO, CyclePISO, GaussianPISO2, CyclePISO2]
  final_window_fraction: 0.3
  y_margin_fraction: 0.1
