family: security
output_dir: results/bilevel/security
experiment:
  seed: 2025
  instances: 427
  iterations: 500
  jobs: 1
  checkpoint_interval: 10
problem:
  dimension_min: 2
  dimension_max: 300
  value_min: 1.0
  value_max: 5.0
  baseline_min: 0.1
  baseline_max: 0.5
  cost_min: 0.1
  cost_max: 0.3
  budget_scale: 0.5
  response_tolerance: 1.0e-09
  response_max_iterations: 30
methods:
  ZOS:
    mu: 0.1
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.05
    step_size_high_dimension: 0.03
  PZOS:
    mu: 0.1
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.05
    step_size_high_dimension: 0.03
  ZO_TG:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.05
    step_size_high_dimension: 0.03
    update_clip: 0.0
  ZO_OGVR:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.02
    step_size_high_dimension: 0.01
    history_window: 10
    distance_weight: 0.1
    update_clip: 0.0
  GZO_NS:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.05
    step_size_high_dimension: 0.03
    alpha_initial: 0.0
    alpha_damping: 0.98
    history_window: 5
    update_clip: 0.0
  GZO_HS:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.05
    step_size_high_dimension: 0.03
    alpha_initial: 0.0
    alpha_damping: 0.98
    history_window: 5
    update_clip: 0.0
  GaussianPISO:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.06
    step_size_high_dimension: 0.04
    gamma: 1.0
    rho: 0.98
    alpha: 0.98
    cycle_length: 10
    unknown_clip_ratio: 1.0
    known_norm_floor: 1.0
    innovation_clip: 0.0
    update_clip: 0.0
  CyclePISO:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.06
    step_size_high_dimension: 0.04
    gamma: 1.0
    rho: 0.98
    alpha: 0.98
    cycle_length: 10
    unknown_clip_ratio: 1.0
    known_norm_floor: 1.0
    innovation_clip: 0.0
    update_clip: 0.0
  GaussianPISO2:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.06
    step_size_high_dimension: 0.04
    gamma: 1.0
    rho: 0.98
    lambda: 0.1
    alpha: 0.98
    cycle_length: 10
    unknown_clip_ratio: 1.0
    known_norm_floor: 1.0
    innovation_clip: 0.0
    update_clip: 0.0
  CyclePISO2:
    radius: 0.1
    radius_schedule: constant
    step_schedule: inverse_sqrt
    dimension_threshold: 100
    step_size_low_dimension: 0.06
    step_size_high_dimension: 0.04
    gamma: 1.0
    rho: 0.98
    lambda: 0.1
    alpha: 0.98
    cycle_length: 10
    unknown_clip_ratio: 1.0
    known_norm_floor: 1.0
    innovation_clip: 0.0
    update_clip: 0.0
plotting:
  methods:
  - ZOS
  - GZO_NS
  - GZO_HS
  - PZOS
  - GaussianPISO
  - CyclePISO
  - GaussianPISO2
  - CyclePISO2
  normalization_methods:
  - ZOS
  - PZOS
  dimension_iterations:
  - 50
  - 150
  - 250
  dimension_plot_min: 100
