experiment:
  seed: 2024
  weeks: ["08", "12", "21", "25", "29", "32"]
  max_samples: 5000
  metric_samples: 1000
  report_grid_points: 101
  checkpoint_every: 1

protocols:
  paper:
    simulations: 100

profiles:
  smoke:
    suites: [components, gamma, rho, lambda, cycle_length]
    weeks: ["08"]
    simulations: 2
    max_samples: 800
    metric_samples: 100
    report_grid_points: 41
  paper:
    suites: [components, gamma, rho, lambda, cycle_length]

problem:
  products: 10
  buyers: 40
  initial_price: 0.5
  outside_weight_per_product: 0.1
  lower_inventory_factor: 0.5
  upper_inventory_factor: 1.5
  cost_ratio_low: 2.0
  cost_ratio_middle: 1.0
  cost_ratio_high: 3.0
  rho_low: 0.25
  rho_high: 0.5

# Parameter names in the pricing implementation:
#   gamma  = coefficient of the known gradient component
#   rho    = first-level residual momentum coefficient
#   lambda = direct-residual weight in PISO^2
#
# The Gaussian and Cycle variants share all common hyperparameters. The only
# difference is the direction family. PISO^2 keeps the production step-decay
# setting used in the main pricing experiment.
defaults:
  piso:
    algorithm: piso
    residual_mode: recursive
    direction: gaussian
    difference: central
    coupling: independent
    radius: 0.40
    radius_decay: 0.96
    step_size: 0.005
    step_decay: 0.98
    gamma: 2.00
    rho: 0.92
    lambda: 0.25
    known_fraction: 0.50
    batch_initial: 30
    batch_increment: 2
    directions_per_step: 1
    cycle_length: 10
    use_known: true
    use_residual: true
    known_noise_std: 0.00
    known_mask_fraction: 1.00
    known_delay: 0
    momentum_initialization: zero
  piso2:
    algorithm: piso2
    residual_mode: recursive
    direction: gaussian
    difference: central
    coupling: independent
    radius: 0.40
    radius_decay: 0.96
    step_size: 0.005
    step_decay: 1.00
    gamma: 2.00
    rho: 0.92
    lambda: 0.25
    known_fraction: 0.50
    batch_initial: 30
    batch_increment: 2
    directions_per_step: 1
    cycle_length: 10
    use_known: true
    use_residual: true
    known_noise_std: 0.00
    known_mask_fraction: 1.00
    known_delay: 0
    momentum_initialization: zero

suites:
  components:
    protocol: paper
    kind: grouped_explicit
    reference: gaussian_piso
    filename: components_ablation
    panels:
      - id: gaussian
        title: Gaussian
        variants:
          - id: gaussian_known_only
            label: $\hat{g}_K$
            template: piso
            overrides:
              direction: gaussian
              use_residual: false
          - id: gaussian_no_momentum
            label: $\gamma\hat{g}_K+R_k$
            template: piso
            overrides:
              direction: gaussian
              residual_mode: fresh_centered
              rho: 0.00
          - id: gaussian_piso
            label: PISO
            template: piso
            overrides:
              direction: gaussian
          - id: gaussian_piso2
            label: PISO$^2$
            template: piso2
            overrides:
              direction: gaussian
      - id: cycle
        title: Cycle
        variants:
          - id: cycle_known_only
            label: $\hat{g}_K$
            template: piso
            overrides:
              direction: orthogonal_cycle
              use_residual: false
          - id: cycle_no_momentum
            label: $\gamma\hat{g}_K+R_k$
            template: piso
            overrides:
              direction: orthogonal_cycle
              residual_mode: fresh_centered
              rho: 0.00
          - id: cycle_piso
            label: PISO
            template: piso
            overrides:
              direction: orthogonal_cycle
          - id: cycle_piso2
            label: PISO$^2$
            template: piso2
            overrides:
              direction: orthogonal_cycle

  gamma:
    protocol: paper
    kind: grouped_sweep
    parameter: gamma
    values: [0.00, 0.50, 1.00, 2.00, 3.00, 4.00]
    reference_value: 2.00
    filename: gamma_ablation
    panels:
      - id: gaussian_piso
        title: GaussianPISO
        template: piso
        overrides: {direction: gaussian}
      - id: cycle_piso
        title: CyclePISO
        template: piso
        overrides: {direction: orthogonal_cycle}
      - id: gaussian_piso2
        title: GaussianPISO$^2$
        template: piso2
        overrides: {direction: gaussian}
      - id: cycle_piso2
        title: CyclePISO$^2$
        template: piso2
        overrides: {direction: orthogonal_cycle}

  rho:
    protocol: paper
    kind: grouped_sweep
    parameter: rho
    values: [0.00, 0.50, 0.80, 0.92, 0.97, 0.99]
    reference_value: 0.92
    filename: rho_ablation
    panels:
      - id: gaussian_piso
        title: GaussianPISO
        template: piso
        overrides: {direction: gaussian}
      - id: cycle_piso
        title: CyclePISO
        template: piso
        overrides: {direction: orthogonal_cycle}
      - id: gaussian_piso2
        title: GaussianPISO$^2$
        template: piso2
        overrides: {direction: gaussian}
      - id: cycle_piso2
        title: CyclePISO$^2$
        template: piso2
        overrides: {direction: orthogonal_cycle}

  lambda:
    protocol: paper
    kind: grouped_sweep
    parameter: lambda
    values: [0.00, 0.25, 0.50, 0.75, 1.00]
    reference_value: 0.25
    filename: lambda_ablation
    panels:
      - id: gaussian_piso2
        title: GaussianPISO$^2$
        template: piso2
        overrides: {direction: gaussian}
      - id: cycle_piso2
        title: CyclePISO$^2$
        template: piso2
        overrides: {direction: orthogonal_cycle}

  cycle_length:
    protocol: paper
    kind: grouped_sweep
    parameter: cycle_length
    values: [1, 2, 5, 10]
    reference_value: 10
    filename: cycle_length_ablation
    plotting:
      y_limit_mode: all
    panels:
      - id: cycle_piso
        title: CyclePISO
        template: piso
        overrides: {direction: orthogonal_cycle}
      - id: cycle_piso2
        title: CyclePISO$^2$
        template: piso2
        overrides: {direction: orthogonal_cycle}

plotting:
  y_limit_mode: final_window
  final_window_fraction: 0.30
  y_margin_fraction: 0.10
  confidence: standard_error
  legend_fontsize: 13.00
  line_width: 2.20
  marker_size: 5.50
