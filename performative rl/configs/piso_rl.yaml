experiment:
  seeds:
  - 100
  - 101
  - 102
  - 103
  - 104
  - 105
  - 106
  - 107
  - 108
  - 109
  - 110
  - 111
  - 112
  - 113
  - 114
  - 115
  - 116
  - 117
  - 118
  - 119
  master_seed: 2026
  problem_seed: 0
  vary_problem_by_seed: false
  max_trajectories: 100000
  evaluation_interval: 1000
  checkpoint_interval: 10
  n_jobs: 8
  output_dir: results/piso_v4_heldout
report:
  smoothing_window: 5
  show_raw_curves: false
  plotting_methods:
  - VanillaPG
  - ZO_TG
  - ZO_OGVR
  - GZO_NS
  - GZO_HS
  - GaussianPISO
  - CyclePISO
  - GaussianPISO2
  - CyclePISO2
  - PePG
  total_iterations: 1000
environment:
  beta: 5.0
  eps: 0.5
  discount: 0.9
  num_followers: 1
  horizon: 100
policy:
  feature_dim: 32
  theta_std: 0.1
  phi_std: 0.2
methods:
  enabled:
  - VanillaPG
  - ZO_TG
  - ZO_OG
  - ZO_OGVR
  - GZO_NS
  - GZO_HS
  - GaussianPISO
  - CyclePISO
  - GaussianPISO2
  - CyclePISO2
  - PePG
  - OraclePePG
  VanillaPG:
    step_size: 0.05
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.02
    batch_initial: 100
    batch_increment: 0
    gradient_clip_norm: 0.25
  ZO_TG:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 200000
    radius_min: 0.5
    step_size: 0.1
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.03
    batch_initial: 50
    batch_increment: 0
    gradient_clip_norm: 0.25
  ZO_OG:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 200000
    radius_min: 0.5
    step_size: 0.02
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.005
    batch_initial: 100
    batch_increment: 0
    baseline_decay: 0.98
    gradient_clip_norm: 0.25
  ZO_OGVR:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 200000
    radius_min: 0.5
    step_size: 0.02
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.005
    batch_initial: 100
    batch_increment: 0
    initial_baseline_batch: 100
    history_window: 10
    distance_weight: 0.1
    gradient_clip_norm: 0.25
  GZO_NS:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 200000
    radius_min: 0.5
    step_size: 0.1
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.03
    batch_initial: 34
    total_batch: 100
    known_batch: 34
    batch_increment: 0
    alpha: 0.9
    gradient_clip_norm: 0.25
  GZO_HS:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 200000
    radius_min: 0.5
    step_size: 0.1
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.03
    alpha: 0.9
    window: 10
    batch_initial: 50
    batch_increment: 0
    gradient_clip_norm: 0.25
  GaussianPISO:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 300000
    radius_min: 0.5
    step_size: 0.1
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.03
    gamma: 1.0
    rho: 0.98
    known_fraction: 0.5
    batch_initial: 34
    total_batch: 100
    batch_increment: 0
    directions_per_update: 1
    rls_forgetting: 0.997
    rls_ridge: 4.0
    residual_warmup_directions: 64
    residual_clip_norm: 0.05
    directional_derivative_clip: 0.5
    gradient_clip_norm: 0.25
  CyclePISO:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 300000
    radius_min: 0.5
    step_size: 0.1
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.03
    gamma: 1.0
    rho: 0.98
    known_fraction: 0.5
    batch_initial: 34
    total_batch: 100
    batch_increment: 0
    directions_per_update: 1
    rls_forgetting: 0.997
    rls_ridge: 4.0
    residual_warmup_directions: 64
    residual_clip_norm: 0.05
    directional_derivative_clip: 0.5
    gradient_clip_norm: 0.25
    cycle_length: 16
  GaussianPISO2:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 300000
    radius_min: 0.5
    step_size: 0.1
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.03
    gamma: 1.0
    rho: 0.98
    known_fraction: 0.5
    batch_initial: 34
    total_batch: 100
    batch_increment: 0
    directions_per_update: 1
    rls_forgetting: 0.997
    rls_ridge: 4.0
    residual_warmup_directions: 64
    residual_clip_norm: 0.05
    directional_derivative_clip: 0.5
    gradient_clip_norm: 0.25
    lambda: 0.1
  CyclePISO2:
    radius: 1.0
    radius_schedule: inverse_sqrt
    radius_scale: 300000
    radius_min: 0.5
    step_size: 0.1
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.03
    gamma: 1.0
    rho: 0.98
    known_fraction: 0.5
    batch_initial: 34
    total_batch: 100
    batch_increment: 0
    directions_per_update: 1
    rls_forgetting: 0.997
    rls_ridge: 4.0
    residual_warmup_directions: 64
    residual_clip_norm: 0.05
    directional_derivative_clip: 0.5
    gradient_clip_norm: 0.25
    lambda: 0.1
    cycle_length: 16
  PePG:
    step_size: 0.5
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.1
    batch_initial: 100
    batch_increment: 0
    gradient_clip_norm: 0.25
    transition_probability_floor: 1.0e-12
  OraclePePG:
    step_size: 2.0
    step_size_schedule: inverse_sqrt
    step_size_scale: 100000
    step_size_min: 0.5
    equivalent_batch: 100
    armijo: 0.0001
    backtrack_factor: 0.5
    minimum_step: 1.0e-08
    max_backtracks: 20
